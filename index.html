<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - VetCare</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="flex flex-envolver items-centro justify-espaciado gap-m py-m px-l fondo-primario movil-columna movil-items-inicio">
    <a class="texto-xl texto-negrita color-texto-blanco sin-subrayado" href="index.html">VetCare <span class="bloque texto-sm texto-normal">Clínica Huellitas</span></a>
    <nav aria-label="Menú principal">
      <ul class="flex flex-envolver gap-s lista-sin-estilo">
        <li><a class="menu-enlace" href="index.html" aria-current="page">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>
  <main class="contenido items-inicio escritorio-grid-2-1">
    <section class="p-xl redondeado fondo-superficie sombra">
      <h1>Iniciar sesión</h1>
      <p>Ingrese con su correo institucional y elija su rol.</p>
      <form action="pages/recepcion-inicio.html" method="get" class="grid gap-l">
        <fieldset>
          <legend>Credenciales</legend>
          <div class="flex flex-columna gap-xs">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" required maxlength="100" placeholder="usuario@huellitas.ec" autocomplete="username">
          </div>
          <div class="flex flex-columna gap-xs">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" required minlength="8" maxlength="30" autocomplete="current-password">
          </div>
          <div class="flex items-centro gap-s">
            <input type="checkbox" id="recordar" name="recordar">
            <label for="recordar">Recordarme</label>
          </div>
        </fieldset>
        <div class="flex flex-columna gap-m mt-m">
          <button type="submit" class="boton ancho-total" formaction="pages/recepcion-inicio.html">Ingresar como recepcionista</button>
          <button type="submit" class="boton ancho-total" formaction="pages/veterinario-inicio.html">Ingresar como veterinario</button>
          <button type="submit" class="boton ancho-total" formaction="pages/admin-inicio.html">Ingresar como administrador</button>
        </div>
      </form>
    </section>
    <aside class="p-l borde-izq-acento redondeado fondo-superficie">
      <h2>Usuarios de prueba</h2>
      <ul class="texto-mono">
        <li>recepcion@huellitas.ec</li>
        <li>sbenitez@huellitas.ec</li>
        <li>admin@huellitas.ec</li>
      </ul>
    </aside>
  </main>
  <footer class="p-m texto-centrado color-texto-blanco fondo-primario-oscuro">
    <p>VetCare · Clínica veterinaria “Huellitas” · Quito, 2026</p>
  </footer>
</body>
</html>
